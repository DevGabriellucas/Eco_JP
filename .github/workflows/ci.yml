name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

# Nenhum job precisa escrever no repositório.
permissions:
  contents: read

jobs:
  quality:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Flutter (setup compartilhado)
        uses: ./.github/actions/flutter-setup
        with:
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze

      - name: Testes unitários
        run: flutter test

  firestore-rules:
    name: Regras de segurança do Firestore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # O emulador do Firestore roda sobre a JVM. O firebase-tools 15.x exige
      # JDK 21+ ("no longer supports Java version before 21").
      - name: Configurar Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools@15.28.2

      - name: Instalar dependências dos testes
        working-directory: test/firestore_rules
        run: npm ci

      # `npm test` sobe o emulador via `firebase emulators:exec`, roda o Jest
      # e derruba o emulador. A firebase.json (porta 8080) fica na raiz do repo.
      - name: Rodar testes de regras
        working-directory: test/firestore_rules
        run: npm test

  # Builds só rodam se a qualidade passar — pegam quebra de compilação por
  # plataforma antes do merge, sem precisar de segredos de assinatura.
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout do código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Flutter (setup compartilhado)
        uses: ./.github/actions/flutter-setup
        with:
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      # Smoke test de compilação release, assinado com a chave de debug. O
      # Gradle só aceita isso com ECOJP_PERMITIR_RELEASE_DEBUG=true explícito;
      # este APK serve para teste interno, nunca para publicar. A release de
      # verdade (release.yml) exige a chave de upload.
      - name: Build APK release (assinatura de debug)
        env:
          ECOJP_PERMITIR_RELEASE_DEBUG: 'true'
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ecojp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
