name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versões instaladas
        run: flutter --version

      - name: Instalar dependências
        run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Arquivos fora do padrão de formatação (não bloqueante)"

      - name: Análise estática
        run: flutter analyze

      - name: Testes unitários
        run: flutter test
