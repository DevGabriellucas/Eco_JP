name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Análise e testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter (setup compartilhado)
        uses: ./.github/actions/flutter-setup
        with:
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed lib test || echo "::warning::Arquivos fora do padrão de formatação (não bloqueante)"

      - name: Análise estática
        run: flutter analyze

      - name: Testes unitários
        run: flutter test

  firestore-rules:
    name: Regras de segurança do Firestore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # O emulador do Firestore roda sobre a JVM.
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: test/firestore_rules/package-lock.json

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependências dos testes
        working-directory: test/firestore_rules
        run: npm ci

      # `npm test` sobe o emulador via `firebase emulators:exec`, roda o Jest
      # e derruba o emulador. A firebase.json (porta 8080) fica na raiz do repo.
      - name: Rodar testes de regras
        working-directory: test/firestore_rules
        run: npm test

  # Builds só rodam se a qualidade passar — pegam quebra de compilação por
  # plataforma antes do merge, sem precisar de segredos de assinatura.
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter (setup compartilhado)
        uses: ./.github/actions/flutter-setup
        with:
          maps-api-key: ${{ secrets.MAPS_API_KEY }}

      # Release assinado com a debug key (config atual do projeto): serve como
      # smoke test e para distribuição interna. Para publicar na Play Store,
      # ver o checklist de segredos de assinatura na DOCUMENTACAO_TECNICA (17.9).
      - name: Build APK release
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ecojp-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
